# Subject lines (bodies live in html/ and text/). Other keys fall back to Keycloak's base theme.
# Keycloak builds subjects from these static strings with no client info, so they can't vary per
# client. Keep them brand-neutral; the per-client branding is in the email body (see brand.ftl).
emailVerificationSubject=Verify your email
passwordResetSubject=Reset your password
