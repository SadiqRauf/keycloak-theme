# Subject lines and overridden message bodies (custom bodies live in html/ and text/). Other keys fall back to Keycloak's base theme.
# Keycloak builds subjects from these static strings with no client info, so they can't vary per
# client. Keep them brand-neutral; the per-client branding is in the email body (see brand.ftl).
emailVerificationSubject=Verify your email
passwordResetSubject=Reset your password

# Security-event emails (password/OTP/credential changes, failed logins, lockouts).
# Keycloak's defaults say "contact an administrator"; we point users to the brand's support email instead.
# The last {N} argument is that address, passed in by our html/ and text/ event-*.ftl overrides
# (picked from the event's client ID, see brand.ftl).
eventLoginErrorBody=A failed login attempt was detected to your account on {0} from {1}. If this was not you, please contact {2}
eventLoginErrorBodyHtml=<p>A failed login attempt was detected to your account on {0} from {1}. If this was not you, please contact <a href="mailto:{2}">{2}</a></p>
eventRemoveTotpBody=OTP was removed from your account on {0} from {1}. If this was not you, please contact {2}
eventRemoveTotpBodyHtml=<p>OTP was removed from your account on {0} from {1}. If this was not you, please contact <a href="mailto:{2}">{2}</a></p>
eventUpdatePasswordBody=Your password was changed on {0} from {1}. If this was not you, please contact {2}
eventUpdatePasswordBodyHtml=<p>Your password was changed on {0} from {1}. If this was not you, please contact <a href="mailto:{2}">{2}</a></p>
eventUpdateTotpBody=OTP was updated for your account on {0} from {1}. If this was not you, please contact {2}
eventUpdateTotpBodyHtml=<p>OTP was updated for your account on {0} from {1}. If this was not you, please contact <a href="mailto:{2}">{2}</a></p>
eventUpdateCredentialBody=Your {0} credential was changed on {1} from {2}. If this was not you, please contact {3}
eventUpdateCredentialBodyHtml=<p>Your {0} credential was changed on {1} from {2}. If this was not you, please contact <a href="mailto:{3}">{3}</a></p>
eventRemoveCredentialBody=Credential {0} was removed from your account on {1} from {2}. If this was not you, please contact {3}
eventRemoveCredentialBodyHtml=<p>Credential {0} was removed from your account on {1} from {2}. If this was not you, please contact <a href="mailto:{3}">{3}</a></p>
eventUserDisabledByTemporaryLockoutBody=Your account has been temporarily disabled because of multiple failed login attempts on {0}. If you need help, please contact {1}
eventUserDisabledByTemporaryLockoutHtml=<p>Your account has been temporarily disabled because of multiple failed login attempts on {0}. If you need help, please contact <a href="mailto:{1}">{1}</a></p>
eventUserDisabledByPermanentLockoutBody=Your account has been disabled because of multiple failed login attempts on {0}. Please contact {1}
eventUserDisabledByPermanentLockoutHtml=<p>Your account has been disabled because of multiple failed login attempts on {0}. Please contact <a href="mailto:{1}">{1}</a></p>
